[project]
name = "dubber"
version = "0.1.0"
description = "11Sport internal video dubbing & subtitle tool"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "openai>=1.40",
  "httpx>=0.27",
  "numpy>=1.26",
  "soundfile>=0.12",
  "pysubs2>=1.7",
  "tenacity>=8.3",
  "faster-whisper>=1.2.1",
  "edge-tts>=7.3.1",
  "onnxruntime<1.20",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
